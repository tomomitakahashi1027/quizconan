<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5a4033"><title>名探偵コナン診断ゲーム</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body><div class="watermark" aria-hidden="true"></div><main class="app"><section id="home" class="card screen active home"><h1><ruby>名探偵<rt>めいたんてい</rt></ruby>コナン<ruby>診断<rt>しんだん</rt></ruby>ゲーム</h1><div class="hero-icons" aria-hidden="true">🎀 ⚽ 👓</div><h2>10<ruby>問<rt>もん</rt></ruby>の<ruby>質問<rt>しつもん</rt></ruby>に<ruby>答<rt>こた</rt></ruby>えると、あなたがどのキャラクターかがわかる！</h2><button id="startBtn" class="primary">診断を始める</button><p class="note">※<ruby>非公式<rt>ひこうしき</rt></ruby>ファンメイドです。<ruby>公式画像<rt>こうしきがぞう</rt></ruby>は<ruby>使<rt>つか</rt></ruby>っていません。</p></section><section id="quiz" class="card screen"><div class="toolbar"><div class="nav-buttons"><button id="homeBtn" class="nav-btn">🏠 ホーム</button><button id="backBtn" class="nav-btn">← <ruby>戻<rt>もど</rt></ruby>る</button></div><span id="counter" class="counter">1 / 10</span></div><div class="progress" aria-label="進み具合"><div id="bar"></div></div><div id="qIcon" class="question-icon"></div><h2 id="question"></h2><div id="answers" class="answers"></div></section><section id="thinking" class="card screen thinking"><div class="spinner">🎀</div><h2><ruby>推理中<rt>すいりちゅう</rt></ruby>...</h2><p><ruby>答<rt>こた</rt></ruby>えを<ruby>調<rt>しら</rt></ruby>べています</p></section><section id="result" class="card screen"><button id="resultHomeBtn" class="nav-btn result-home">🏠 ホーム</button><p class="center">🏆 <ruby>診断結果<rt>しんだんけっか</rt></ruby></p><div id="resultIcon" class="result-icon"></div><h2 id="resultName" class="result-name"></h2><h3 id="tagline" class="tagline"></h3><p id="description" class="description"></p><div class="section"><h3>💕 <ruby>相性<rt>あいしょう</rt></ruby>No.1</h3><div class="compat"><span id="compatIcon"></span><div><strong id="compatName"></strong><p id="compatText"></p></div></div></div><div class="section"><h3>🥇 キャラクターランキング</h3><div id="ranking"></div></div><div class="section"><h3>📣 SNSで<ruby>共有<rt>きょうゆう</rt></ruby></h3><div class="shares"><a id="shareX" target="_blank" rel="noopener">Xで共有</a><a id="shareLine" target="_blank" rel="noopener">LINEで共有</a><button id="copyBtn">結果をコピー</button></div><p id="copyStatus" class="center"></p></div><button id="restartBtn" class="primary">もう<ruby>一度<rt>いちど</rt></ruby>あそぶ</button></section></main><footer><ruby>非公式<rt>ひこうしき</rt></ruby>ファンメイド<ruby>診断<rt>しんだん</rt></ruby>ゲーム</footer></body></html>
